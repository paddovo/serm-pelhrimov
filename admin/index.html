<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrace | Škola historického šermu Pelhřimov</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased p-8">

  <div id="admin-login-box" class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="text-3xl text-amber-400">🔒</div>
      <h1 class="text-2xl font-bold font-serif text-slate-100 uppercase">Administrace ŠHŠ Pelhřimov</h1>
      <p class="text-xs text-slate-400">Přístup pouze pro oprávněné trenéry a správce.</p>
    </div>
    <form id="admin-login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Heslo správce</label>
        <input type="password" id="admin-pass" required placeholder="Vložte heslo..." class="w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-slate-100">
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded text-xs uppercase">Vstoupit do správy</button>
    </form>
    <div id="admin-login-error" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/30 p-2.5 rounded text-center"></div>
  </div>

  <div id="admin-dashboard" class="hidden max-w-6xl mx-auto space-y-8">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold font-serif uppercase text-amber-400">🛡️ Dashboard správy</h1>
      <button id="admin-logout-btn" class="bg-slate-900 border border-slate-800 text-xs text-slate-300 hover:text-red-400 px-4 py-2 rounded uppercase font-bold">Odhlásit se</button>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
      <h2 class="text-lg font-bold font-serif uppercase text-slate-100">Správa rezervací & Akcí</h2>
      <p class="text-xs text-slate-400">Všechna data jsou spravována v souboru <code class="text-amber-400">data/events.json</code> nebo přes administrátorské úložiště.</p>
    </div>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
