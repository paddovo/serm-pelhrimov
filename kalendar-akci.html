<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalendář akcí | Škola historického šermu Pelhřimov</title>
  <meta name="description" content="Plánované akce, semináře a nábory Školy historického šermu Pelhřimov.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.ico">
</head>
<body class="bg-[#0c0c0e] text-slate-100 font-sans antialiased flex flex-col min-h-screen">

  <!-- HEADER / NAVIGATION -->
  <header class="fixed top-0 left-0 right-0 z-[100] bg-[#0f1015] shadow-xl backdrop-blur-md border-b border-amber-500/20 py-3">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <img src="images/logo.png" alt="Škola historického šermu Pelhřimov" class="h-11 w-auto object-contain group-hover:scale-105 transition-transform">
        <div class="flex flex-col">
          <span class="font-bold text-base sm:text-lg tracking-wider text-amber-400 uppercase font-serif leading-none">ŠHŠ Pelhřimov</span>
          <span class="text-[9px] text-slate-400 tracking-widest uppercase mt-0.5">Škola historického šermu</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-6">
        <a href="o-nas.html" class="text-xs font-semibold text-slate-300 hover:text-amber-400 uppercase tracking-widest">ŠKOLA</a>
        <a href="kurzy.html" class="text-xs font-semibold text-slate-300 hover:text-amber-400 uppercase tracking-widest">TRÉNINKY</a>

      <div class="hidden md:flex items-center gap-4">

          CHCI ZAČÍT ➔
        </a>
      </div>

      <button id="mobile-menu-toggle" class="md:hidden text-slate-300 hover:text-amber-400 p-2 text-xl">☰</button>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobile-drawer" class="hidden md:hidden bg-[#0c0c0e] border-b border-amber-500/20 px-6 pt-4 pb-6 space-y-4">
      <a href="o-nas.html" class="block text-sm font-semibold text-slate-200 hover:text-amber-400 uppercase py-2 border-b border-slate-800">ŠKOLA</a>
      <a href="kurzy.html" class="block text-sm font-semibold text-slate-200 hover:text-amber-400 uppercase py-2 border-b border-slate-800">TRÉNINKY</a>

      <a href="kontakt.html" class="block text-sm font-semibold text-slate-200 hover:text-amber-400 uppercase py-2 border-b border-slate-800">KONTAKT</a>

      <!-- DYNAMIC EVENTS CONTAINER -->
      <div id="events-container" class="space-y-6">
        <!-- Loaded dynamically via js/kalendar.js -->
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-[#0c0c0e] border-t border-slate-800 text-slate-400 py-8 text-center text-xs">
    <p>© 2025 Škola historického šermu Pelhřimov. sermpelhrimov.cz</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/kalendar.js"></script>
